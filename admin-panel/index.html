<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bambú Admin — Conexiones en Vivo</title>
    <style>
        :root {
            --bg: #0f0f12;
            --bg-card: #1a1a21;
            --bg-item: #22222c;
            --border: rgba(192, 132, 252, 0.12);
            --text: #f3f4f6;
            --muted: #9ca3af;
            --accent: #c084fc;
            --green: #34d399;
            --red: #f87171;
            --yellow: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }

        header {
            padding: 20px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        header h1 span { color: var(--accent); }

        #status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--muted);
        }

        #status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--yellow);
            transition: background 0.3s;
        }

        #status-dot.ok     { background: var(--green); box-shadow: 0 0 6px var(--green); }
        #status-dot.error  { background: var(--red);   box-shadow: 0 0 6px var(--red); }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 28px 32px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 700px) { main { grid-template-columns: 1fr; } }

        section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
        }

        section h2 {
            font-size: 14px;
            font-weight: 500;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        section h2 .count {
            background: var(--accent);
            color: #0f0f12;
            font-size: 11px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 20px;
        }

        #conectados-list, #eventos-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 420px;
            overflow-y: auto;
        }

        .user-card {
            background: var(--bg-item);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        .user-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: rgba(192, 132, 252, 0.15);
            border: 1px solid rgba(192, 132, 252, 0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        .user-info { flex: 1; min-width: 0; }
        .user-name { font-size: 14px; font-weight: 600; }
        .user-meta { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 20px;
            flex-shrink: 0;
        }
        .badge-on  { background: rgba(52, 211, 153, 0.15); color: var(--green); border: 1px solid rgba(52,211,153,0.3); }
        .badge-off { background: rgba(248, 113, 113, 0.15); color: var(--red);   border: 1px solid rgba(248,113,113,0.3); }

        .evento-row {
            background: var(--bg-item);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        .evento-icon { font-size: 16px; flex-shrink: 0; }
        .evento-body { flex: 1; }
        .evento-user { font-weight: 600; }
        .evento-time { font-size: 11px; color: var(--muted); margin-left: auto; flex-shrink: 0; }

        .empty-msg {
            text-align: center;
            padding: 32px 0;
            color: var(--muted);
            font-size: 13px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        #reconect-btn {
            display: none;
            margin-top: 12px;
            padding: 8px 18px;
            background: var(--accent);
            color: #0f0f12;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1>Bambú <span>Admin</span> — Conexiones en vivo</h1>
    <div id="status-badge">
        <div id="status-dot"></div>
        <span id="status-text">Conectando…</span>
    </div>
</header>

<main>
    <section>
        <h2>Conectados ahora <span id="count-badge" class="count">0</span></h2>
        <div id="conectados-list">
            <div class="empty-msg">Esperando sesiones activas…</div>
        </div>
    </section>

    <section>
        <h2>Actividad reciente</h2>
        <div id="eventos-list">
            <div class="empty-msg">Sin eventos todavía</div>
        </div>
        <button id="reconect-btn" onclick="conectarWS()">Reconectar</button>
    </section>
</main>

<script>
    // ─── Configura la URL de tu backend aquí ──────────────────────────────────
    const WS_URL = "ws://localhost:8000/pfsense/admin/ws";
    // ─────────────────────────────────────────────────────────────────────────

    let ws = null;
    let sesionesActivas = {};   // session_id → data
    let MAX_EVENTOS = 50;

    const dot        = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const listConn   = document.getElementById("conectados-list");
    const listEvt    = document.getElementById("eventos-list");
    const countBadge = document.getElementById("count-badge");
    const reconBtn   = document.getElementById("reconect-btn");

    function setStatus(state, text) {
        dot.className = state;
        statusText.textContent = text;
    }

    function conectarWS() {
        reconBtn.style.display = "none";
        setStatus("", "Conectando…");
        ws = new WebSocket(WS_URL);

        ws.onopen = () => setStatus("ok", "En vivo");

        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);

            if (msg.type === "estado_inicial") {
                sesionesActivas = {};
                (msg.data || []).forEach(s => sesionesActivas[s.session_id] = s);
                renderConectados();
                return;
            }

            if (msg.type === "nueva_conexion") {
                sesionesActivas[generarId(msg.data)] = msg.data;
                renderConectados();
                agregarEvento("🟢", msg.data.username, "se conectó", msg.timestamp, "badge-on");
            }

            if (msg.type === "desconexion") {
                const key = Object.keys(sesionesActivas).find(
                    k => sesionesActivas[k].username === msg.data.username && sesionesActivas[k].ip === msg.data.ip
                );
                if (key) delete sesionesActivas[key];
                renderConectados();
                agregarEvento("🔴", msg.data.username, "se desconectó", msg.timestamp, "badge-off");
            }
        };

        ws.onclose = () => {
            setStatus("error", "Sin conexión");
            reconBtn.style.display = "block";
        };

        ws.onerror = () => setStatus("error", "Error de conexión");
    }

    function generarId(data) {
        return `${data.username}_${data.ip}_${Date.now()}`;
    }

    function renderConectados() {
        const lista = Object.values(sesionesActivas);
        countBadge.textContent = lista.length;

        if (lista.length === 0) {
            listConn.innerHTML = '<div class="empty-msg">Nadie conectado ahora mismo</div>';
            return;
        }

        listConn.innerHTML = lista.map(s => `
            <div class="user-card">
                <div class="user-avatar">👤</div>
                <div class="user-info">
                    <div class="user-name">${esc(s.username)}</div>
                    <div class="user-meta">IP: ${esc(s.ip)} · MAC: ${esc(s.mac || "—")}</div>
                </div>
                <span class="badge badge-on">Online</span>
            </div>
        `).join("");
    }

    function agregarEvento(icono, usuario, accion, ts, badgeClass) {
        const esVacio = listEvt.querySelector(".empty-msg");
        if (esVacio) listEvt.innerHTML = "";

        const hora = ts ? new Date(ts).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "--:--";
        const fila = document.createElement("div");
        fila.className = "evento-row";
        fila.innerHTML = `
            <span class="evento-icon">${icono}</span>
            <span class="evento-body">
                <span class="evento-user">${esc(usuario)}</span> ${accion}
            </span>
            <span class="evento-time">${hora}</span>
        `;
        listEvt.insertBefore(fila, listEvt.firstChild);

        // Limitar historial
        while (listEvt.children.length > MAX_EVENTOS) {
            listEvt.removeChild(listEvt.lastChild);
        }
    }

    function esc(str) {
        return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    conectarWS();
</script>
</body>
</html>

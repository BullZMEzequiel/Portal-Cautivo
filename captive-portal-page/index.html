<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bambú — Conexión Wi-Fi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #131316;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: #1e1e24;
            border: 1px solid rgba(192, 132, 252, 0.15);
            border-radius: 16px;
            padding: 36px 28px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .logo { font-size: 48px; margin-bottom: 14px; }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .sub {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .field { margin-bottom: 16px; text-align: left; }

        label {
            display: block;
            font-size: 12px;
            color: #9ca3af;
            font-weight: 500;
            margin-bottom: 6px;
            padding-left: 2px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #c084fc;
            background: rgba(192,132,252,0.06);
            box-shadow: 0 0 0 3px rgba(192,132,252,0.15);
        }

        input[type="submit"] {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: #c084fc;
            border: none;
            border-radius: 8px;
            color: #131316;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        input[type="submit"]:hover { background: #a855f7; }

        .footer {
            margin-top: 22px;
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🍽️</div>
        <h1>¡Bienvenido a Bambú!</h1>
        <p class="sub">Ingresá las credenciales proporcionadas por el dueño para conectarte al Wi-Fi.</p>

        <form method="post" action="$PORTAL_ACTION$">
            <input type="hidden" name="redirurl" value="$PORTAL_REDIRURL$">
            <input type="hidden" name="zone"     value="$PORTAL_ZONE$">

            <div class="field">
                <label for="auth_user">Usuario</label>
                <input type="text" id="auth_user" name="auth_user"
                       placeholder="Ej. juangarcia" required
                       autocomplete="off" autocorrect="off"
                       autocapitalize="none" spellcheck="false">
            </div>

            <div class="field">
                <label for="auth_pass">Contraseña</label>
                <input type="password" id="auth_pass" name="auth_pass"
                       placeholder="••••••••" required>
            </div>

            <input type="submit" name="accept" value="Conectarme">
        </form>

        <p class="footer">Al conectarte aceptás las políticas de uso responsable de red.</p>
    </div>
</body>
</html>
